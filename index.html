<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neurosift Brain</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      // Applies the saved theme before the first paint; src/theme.ts writes the same key.
      // Dark is the default here, as src/main.tsx sets it, so nothing saved means dark.
      try {
        var theme = localStorage.getItem("neurosiftTheme") || "dark";
        if (theme === "system")
          theme = matchMedia("(prefers-contrast: more)").matches
            ? "high-contrast"
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "";
        if (theme === "dark" || theme === "high-contrast")
          document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
